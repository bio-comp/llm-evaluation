name: Public CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.13'
      - name: Verify locked environment metadata
        run: |
          python -m pip install uv==0.8.4
          uv lock --check
          uv sync --frozen --all-packages --group dev --extra drive
      - name: Static checks and branch coverage
        run: |
          uv run --frozen --all-packages --extra drive ruff check src tests packages/canonical-sync/src packages/canonical-sync/tests
          uv run --frozen --all-packages --extra drive mypy --python-version 3.11 src packages/canonical-sync/src
          uv run --frozen --all-packages --extra drive coverage erase
          uv run --frozen --all-packages --extra drive coverage run --branch -m pytest -m 'not live_drive' -q
          uv run --frozen --all-packages --extra drive coverage report --include='src/*,packages/canonical-sync/src/*' --fail-under=80
      - name: Build and exercise installed entrypoints in isolated venvs
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          python -m pip install build==1.3.0
          mkdir -p "$build_dir/dist/canonical" "$build_dir/dist/root" "$build_dir/wheelhouse"
          python -m build packages/canonical-sync --sdist --wheel --outdir "$build_dir/dist/canonical"
          python -m build --sdist --wheel --outdir "$build_dir/dist/root"

          # 1. Isolated fresh venv for canonical-sync
          python -m venv "$build_dir/venv-canonical"
          "$build_dir/venv-canonical/bin/pip" wheel --wheel-dir="$build_dir/wheelhouse" "$build_dir"/dist/canonical/*.whl
          "$build_dir/venv-canonical/bin/pip" install --no-index --find-links="$build_dir/wheelhouse" canonical-sync
          "$build_dir/venv-canonical/bin/python" - <<'PY_CANONICAL'
          from importlib.metadata import PackageNotFoundError, version
          import canonical_sync.records
          for distribution in ("google-api-python-client", "google-auth", "llm-evaluation"):
              try:
                  version(distribution)
              except PackageNotFoundError:
                  continue
              raise AssertionError(f"canonical-sync unexpectedly installed {distribution}")
          PY_CANONICAL

          # 2. Isolated fresh venv for llm-evaluation (resolving canonical-sync from built wheel)
          python -m venv "$build_dir/venv-root"
          "$build_dir/venv-root/bin/pip" install --no-index --find-links="$build_dir/wheelhouse" "$build_dir"/dist/root/*.whl
          "$build_dir/venv-root/bin/python" - <<'PY_BASE'
          from importlib.metadata import PackageNotFoundError, version
          import canonical_sync.records
          import llm_evaluation.canonical_authority
          import llm_evaluation.canonical_reconciliation
          for distribution in ("google-api-python-client", "google-auth"):
              try:
                  version(distribution)
              except PackageNotFoundError:
                  continue
              raise AssertionError(f"base wheel unexpectedly installed {distribution}")
          PY_BASE
          (unset PYTHONPATH; "$build_dir/venv-root/bin/llm-evaluation" fixtures/e002_synthetic.json --k 2 > "$build_dir/preview.json")
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["macro"]["marginal"] == 0.5' "$build_dir/preview.json"
          (unset PYTHONPATH; "$build_dir/venv-root/bin/llm-evaluation-stopping" > "$build_dir/stopping-preview.json")
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["record_type"] == "e002_stopping_simulation"' "$build_dir/stopping-preview.json"
          if (unset PYTHONPATH; "$build_dir/venv-root/bin/llm-evaluation" fixtures/e002_synthetic.json --k 2 --output "$build_dir/wheel-output.json") >"$build_dir/wheel-error.log" 2>&1; then
            echo "installed wheel unexpectedly finalized" >&2
            exit 1
          fi
          grep -q "finalization requires a source checkout" "$build_dir/wheel-error.log"
          test ! -e "$build_dir/wheel-output.json"
      - name: Finalize and verify public synthetic diagnostic
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          python -m llm_evaluation.cli fixtures/e002_synthetic.json --k 2 --output "$artifact_dir/e002.json"
          E002_ARTIFACT="$artifact_dir/e002.json" python - <<'PY'
          import os
          import platform
          from pathlib import Path
          from llm_evaluation.records import software_identity, verify_result_software, read_finalized, raw_sha256
          source = Path("fixtures/e002_synthetic.json").read_bytes()
          result = read_finalized(Path(os.environ["E002_ARTIFACT"]), source)
          assert (result["software_commit"], result["implementation_sha256"]) == software_identity()
          verify_result_software(result)
          assert result["python_version"] == platform.python_version()
          assert result["fixture_raw_sha256"] == raw_sha256(source)
          assert result["macro"]["best_of_k"] == 11 / 18
          assert result["macro"]["all_k"] == 7 / 18
          PY
          if python -m llm_evaluation.cli fixtures/e002_synthetic.json --k 2 --output "$artifact_dir/e002.json"; then
            echo "second finalization unexpectedly replaced the existing record" >&2
            exit 1
          fi

      - name: Finalize exact E-002 stopping simulation
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT
          python -m llm_evaluation.stopping_cli --output "$artifact_dir/stopping.json"
          E002_SIM="$artifact_dir/stopping.json" python - <<'PY_SIM'
          import os
          from fractions import Fraction
          from pathlib import Path
          from llm_evaluation.records import software_identity
          from llm_evaluation.stopping_records import read_finalized
          record = read_finalized(Path(os.environ["E002_SIM"]))
          assert (record["software_commit"], record["package_source_sha256"]) == software_identity()
          assert record["method"] == "exact_finite_state_rational_v1"
          rows = record["results"]["development"]
          naive = next(r for r in rows if r["policy"] == "naive" and r["p"] == "1/2")
          assert Fraction(naive["accept"]) + Fraction(naive["reject"]) > Fraction(1, 10)
          PY_SIM
          if python -m llm_evaluation.stopping_cli --output "$artifact_dir/stopping.json"; then
            echo "second simulation finalization unexpectedly replaced record" >&2
            exit 1
          fi
