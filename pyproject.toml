[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation"
version = "0.1.0"
description = "Public, reproducible evaluation-methodology diagnostics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
llm-evaluation = "llm_evaluation.cli:main"
llm-evaluation-stopping = "llm_evaluation.stopping_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation"]

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "mypy==1.18.2",
    "ruff==0.14.4",
]
