[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation"
version = "0.1.0"
description = "Public, reproducible evaluation-methodology diagnostics"
requires-python = ">=3.11"
dependencies = [
    "canonical-sync",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
drive = ["canonical-sync[drive]"]

[project.scripts]
llm-evaluation = "llm_evaluation.cli:main"
llm-evaluation-stopping = "llm_evaluation.stopping_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation"]

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "mypy==1.18.2",
    "pytest>=9,<10",
    "ruff==0.14.4",
]

[tool.uv.sources]
canonical-sync = { workspace = true }

[tool.uv.workspace]
members = ["packages/canonical-sync"]

[tool.pytest.ini_options]
markers = [
    "live_drive: explicit read-only Google Drive authority verification",
]
