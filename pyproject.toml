[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation"
version = "0.1.0"
description = "Public, reproducible evaluation-methodology diagnostics"
requires-python = ">=3.11"
dependencies = [
    "canonical-sync",
    "httpx>=0.28,<1",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
drive = ["canonical-sync[drive]"]
local-auth = [
    "google-auth-oauthlib==1.5.0",
]

[project.scripts]
llm-evaluation = "llm_evaluation.cli:main"
llm-evaluation-stopping = "llm_evaluation.stopping_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation"]

[dependency-groups]
dev = [
    "build==1.3.0",
    "coverage==7.17.0",
    "hypothesis>=6.100.0",
    "mypy==1.18.2",
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly>=3.15.0",
    "ruff==0.14.4",
]

[tool.uv.sources]
canonical-sync = { workspace = true }

[tool.uv.workspace]
members = ["packages/canonical-sync"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "live_drive: explicit read-only Google Drive authority verification",
    "live_llama: explicit standalone model preflight",
]
