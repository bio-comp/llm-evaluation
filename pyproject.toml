[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llm-evaluation"
version = "0.1.0"
description = "Public, reproducible evaluation-methodology diagnostics"
requires-python = ">=3.11"
dependencies = [
    "canonical-sync @ git+https://github.com/bio-comp/canonical-sync.git@a157898a4c2fd56984afb410d426f913ae7b2f09",
    "httpx>=0.28,<1",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
drive = ["canonical-sync[drive] @ git+https://github.com/bio-comp/canonical-sync.git@a157898a4c2fd56984afb410d426f913ae7b2f09"]
local-auth = ["canonical-sync[local-auth] @ git+https://github.com/bio-comp/canonical-sync.git@a157898a4c2fd56984afb410d426f913ae7b2f09"]

[project.scripts]
llm-evaluation = "llm_evaluation.cli:main"
llm-evaluation-stopping = "llm_evaluation.stopping_cli:main"
llm-evaluation-metric-lab = "llm_evaluation.metric_lab_cli:main"
llm-evaluation-drift-lab = "llm_evaluation.drift_lab_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_evaluation"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "build==1.3.0",
    "coverage==7.17.0",
    "hypothesis>=6.100.0",
    "mypy==1.18.2",
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly>=3.15.0",
    "ruff==0.14.4",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "live_drive: explicit read-only Google Drive authority verification",
    "live_llama: explicit standalone model preflight",
]
